name: Build Print Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'bridge-android/**'
      - '.github/workflows/build-bridge-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build bridge-android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: bridge-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yonukom-print-bridge-apk
          path: bridge-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
